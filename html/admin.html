<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Biscit - Admin Panel</title>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
</head>
<body>
    <div id="admin-login-view">
        <h1>Admin Login</h1>
        <input type="password" id="admin-password-input" placeholder="Password">
        <button id="admin-login-button">Login</button>
        <p id="admin-login-message"></p>
    </div>

    <div id="admin-main-view" style="display: none;">
        <div class="tab-bar">
            <button class="tab-link active" data-tab="websites">Websites</button>
            <button class="tab-link" data-tab="settings">Settings</button>
            <button class="tab-link" data-tab="devices">Online Devices</button>
        </div>

        <div id="websites" class="tab-content active">
            <!-- Content for Website List will go here, similar to the old structure -->
            <h2>Websites</h2>
            <button id="add-current-tab-button">+ Add Current Tab</button>
            <ul id="website-list"></ul>
        </div>

    <div id="settings" class="tab-content">
        <!-- Content for Settings will go here -->
        <h2>Settings</h2>
        <input type="password" id="new-password" placeholder="New Password">
        <button id="change-password-button">Change Password</button>
        <hr>
        <button id="logout-button">Logout</button>
        <hr>
        <h2>External Sync Settings</h2>
        <label>
            <input type="checkbox" id="remote-sync-enabled">
            Enable Remote Sync
        </label>
        <input type="url" id="remote-sync-url" placeholder="https://your-server.com/path">
        <button id="save-remote-sync-button">Save Sync Settings</button>
        <p id="remote-sync-message"></p>
    </div>

    <div id="devices" class="tab-content">
        <!-- Content for Online Devices will go here -->
        <h2>Online Devices</h2>
        <ul id="device-list"></ul>
    </div>

    <script src="../js/admin.js"></script>

    <!-- Modal for cookie editor -->
    <div id="edit-cookie-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Edit Cookies for <span id="modal-site-name"></span></h2>
            <textarea id="cookie-editor" placeholder="Paste cookies in JSON or Netscape format..."></textarea>
            <button id="save-cookies-button">Save Cookies</button>
        </div>
    </div>
</body>
</html>
