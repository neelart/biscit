<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Biscit</title>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
</head>
<body>
    <div class="tab-bar">
        <button class="tab-link active" data-tab="home" title="Actions for the current page">Home</button>
        <button class="tab-link" data-tab="websites" title="See the full list of managed websites">Websites</button>
        <button class="tab-link" data-tab="settings" title="Configure extension settings">Settings</button>
        <button class="tab-link" data-tab="devices" title="See a list of connected devices">Online Devices</button>
    </div>

    <div id="home" class="tab-content active">
        <h2>Current Page</h2>
        <input type="text" id="current-url" readonly>

        <div class="action-buttons">
            <button id="home-add-cookies" title="Add/Edit cookies for this page">Add/Edit Cookies</button>
            <button id="home-delete-cookies" title="Delete all cookies for this page">Delete Cookies</button>
            <button id="home-export-cookies" title="Export cookies as a JSON file">Export</button>
        </div>

        <!-- User-facing Toggle -->
        <div id="user-sync-control" class="sync-control">
            <label class="switch" title="Auto Sync Cookies: Automatically receive latest cookies shared by admin for this site.">
                <input type="checkbox" id="home-auto-sync-toggle">
                <span class="slider"></span>
            </label>
            <label for="home-auto-sync-toggle">Auto Sync Cookies</label>
        </div>

        <!-- Admin-facing Toggle -->
        <div id="admin-push-control" class="sync-control admin-only" style="display: none;">
            <label class="switch" title="Auto Push Cookies: Auto share and update cookies to all users for this site.">
                <input type="checkbox" id="home-auto-push-toggle">
                <span class="slider"></span>
            </label>
            <label for="home-auto-push-toggle">Auto Push Cookies</label>
        </div>
    </div>

    <div id="websites" class="tab-content">
        <div class="toolbar">
            <input type="text" id="search-bar" placeholder="Filter websites...">
            <button id="add-site-button" class="admin-only" style="display: none;" title="Add a new website manually">+</button>
        </div>
        <ul id="website-list">
            <!-- Website items will be rendered here by app.js -->
        </ul>
    </div>

    <div id="settings" class="tab-content">
        <h2>Settings</h2>
        <div class="admin-only" style="display: none;">
            <h3>Admin Settings</h3>
            <p>Change Admin Password:</p>
            <input type="password" id="new-password" placeholder="New Password">
            <button id="change-password-button">Save Password</button>
            <hr>
            <h3>External Sync Settings</h3>
            <label>
                <input type="checkbox" id="remote-sync-enabled">
                Enable Remote Sync
            </label>
            <input type="url" id="remote-sync-url" placeholder="https://your-server.com/path/biscit_sync.php">
            <button id="save-remote-sync-button">Save Sync Settings</button>
            <button id="export-sync-file-button">Export Sync File</button>
            <hr>
            <button id="logout-button">Logout</button>
        </div>
        <div class="user-settings">
             <p>To access admin settings, please log in via the extension's options page.</p>
        </div>
    </div>

    <div id="devices" class="tab-content">
        <!-- Online devices tab content will be added in a later step -->
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
