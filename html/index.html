<!DOCTYPE html>
<html>
<head>
    <title>Biscit</title>
    <link rel="stylesheet" type="text/css" href="../css/main.css">
</head>
<body>
    <!-- Login View -->
    <div id="login-view">
        <h1>Biscit Login</h1>
        <div id="login-container">
            <h2>Admin Password</h2>
            <input type="password" id="password" placeholder="Enter password">
            <button id="login-button">Login</button>
            <p id="login-message"></p>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" style="display: none;">
        <div class="header">
            <h1>Biscit</h1>
            <button id="settings-button">⚙️</button>
        </div>

        <div id="website-list-view">
            <h2>Websites</h2>
            <div class="toolbar">
                <input type="text" id="search-bar" placeholder="Filter websites...">
                <button id="add-site-button" class="admin-only">+</button>
            </div>
            <ul id="website-list">
                <!-- Website items will be rendered here by app.js -->
                <!-- Example of a list item structure:
                <li>
                    <span class="site-name">example.com</span>
                    <div class="controls">
                        <label class="switch">
                            <input type="checkbox" class="sync-toggle">
                            <span class="slider"></span>
                        </label>
                        <button class="control-btn refresh-btn">🔄</button>
                        <button class="control-btn edit-btn">✏️</button>
                        <button class="control-btn delete-btn admin-only">🗑️</button>
                    </div>
                </li>
                -->
            </ul>
        </div>

        <div id="settings-view" style="display: none;">
            <!-- Settings will go here -->
            <h2>Settings</h2>
            <button id="back-to-list-button">Back to List</button>
        </div>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
